<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Store · GNDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<meta name="description" content="Pay GNDA league fees, membership and Music City Classic sponsorships online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px}
.lead{font-size:clamp(16px,1.9vw,18px);line-height:1.55;max-width:62ch;margin:0}
/* Store: intro, then one card grid per group (league fees, sponsorships), then a coming-soon note. */
.group{margin-top:32px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.item{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item h3{margin:0;color:var(--ink);font-size:20px}
.price{font:700 40px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.unit{font:600 12px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item p{margin:4px 0 0;color:var(--ink2);font-size:14px;flex:1}
.item .btn{align-self:flex-start;margin-top:10px}
.btn.primary{background:var(--green);color:var(--surface);border:1px solid var(--green)}
.soon{margin-top:32px;padding:16px 18px;border:1px dashed var(--rule);border-radius:12px;color:var(--muted);font-size:15px}
@media (max-width:900px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .grid{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="store"></script>
<h1 class="sr">GNDA store</h1>

<main>
  <div class="wrap">
    <p class="lead" id="intro"></p>
    <div id="groups"></div>
    <p class="soon" id="soon"></p>
  </div>
</main>
<script src="../data/store.js"></script>
<script src="../data/sheet.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function $(id){return document.getElementById(id)}
  function link(l){l=String(l||""); return /^https?:\/\//i.test(l) ? l : (l ? "../"+l.replace(/^\/+/,"") : "")}
  function linkify(t){ return esc(t).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m,txt,url){ return '<a href="'+esc(link(url))+'">'+txt+'</a>'; }); }
  var S = window.GNDA_STORE || {};
  $("intro").textContent = S.intro || "";
  $("groups").innerHTML = (S.groups||[]).map(function(g){
    return '<section class="group"><h2>'+esc(g.title)+'</h2><div class="grid">'+(g.items||[]).map(function(i){
      return '<div class="item"><h3>'+esc(i.name)+'</h3><div class="price">'+esc(i.price)+'</div><div class="unit">'+esc(i.unit||"")+'</div>'+
        (i.text?'<p>'+linkify(i.text)+'</p>':'')+(i.link?'<a class="btn primary" href="'+esc(link(i.link))+'" rel="noopener">Pay online</a>':'')+'</div>';
    }).join("")+'</div></section>';
  }).join("");
  var soon=$("soon"); if(S.comingSoon) soon.textContent=S.comingSoon; else soon.hidden=true;
})();
</script>
</body>
</html>
