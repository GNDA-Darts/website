<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Page not found · GNDA</title>
<script>
// GitHub Pages shows this page for any address that doesn't exist. Old addresses from the Wix site are
// sent straight to their new page; anything else shows "Page not found" with links to the main pages.
// To add an old address: add a line to OLD below ("old-address": "new page"). An entry ending in "/*"
// matches every address under it (e.g. all old store product pages).
(function(){
  var OLD = {
    "signups":                          "league/register/index.html",
    "store/*":                          "store/index.html",
    "become-a-member":                  "store/index.html",
    "calendar":                         "index.html",
    "blog":                             "index.html",
    "members":                          "index.html",
    "board-of-directors":               "about/index.html",
    "copy-of-about":                    "about/index.html",
    "copy-of-about-the-gnda":           "about/index.html",
    "file-share":                       "about/index.html",
    "board-meeting-minutes":            "about/index.html#minutes",
    "post/*":                           "about/index.html#minutes",
    "copy-of-league-play-membership":   "league/index.html",
    "rules-by-laws":                    "league/rules/index.html",
    "gndastats":                        "league/stats/index.html#standings",
    "teamstats":                        "league/stats/index.html#standings",
    "dartconnect":                      "league/stats/index.html#standings",
    "playerstats":                      "league/stats/index.html#players",
    "leagueschedule":                   "league/index.html",
    "subs":                             "league/subs/index.html",
    "pub-locator":                      "venues/index.html"
  };
  // The draft site lives in a folder (gnda-darts.github.io/website/); the real domain has none.
  var path = location.pathname;
  var base = /\.github\.io$/i.test(location.hostname) ? "/" + (path.split("/")[1] || "") + "/" : "/";
  var rel = decodeURIComponent(path.slice(base.length)).toLowerCase().replace(/\/+$/, "").replace(/\/index\.html?$/, "");
  var to = OLD[rel];
  if (!to) for (var k in OLD) {
    if (k.slice(-2) === "/*" && rel.indexOf(k.slice(0, -1)) === 0) { to = OLD[k]; break; }
  }
  window.GNDA_BASE = base;
  if (to) location.replace(base + to);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<script>
  // This page can be shown at any depth, so files are loaded from the site's top folder.
  document.write('<link rel="icon" type="image/png" href="'+GNDA_BASE+'assets/favicon.png">'+
    '<link rel="stylesheet" href="'+GNDA_BASE+'assets/site.css"><link rel="stylesheet" href="'+GNDA_BASE+'assets/pages.css">');
</script>
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:48px 72px}
.nf h1{font:700 clamp(30px,5vw,44px)/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 10px}
.nf p{color:var(--ink2);margin:0 0 22px;max-width:56ch}
.go{list-style:none;margin:0;padding:0;max-width:720px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.go a{display:block;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;text-decoration:none;color:var(--ink);
  font:700 19px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.go a:hover{border-color:var(--ink)}
.go small{display:block;margin-top:4px;font:400 13px/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
</style>
</head>
<body>
<script>document.write('<script src="'+GNDA_BASE+'assets/site.js" data-root="'+GNDA_BASE+'" data-page=""><\/script>');</script>

<main>
  <div class="wrap nf">
    <h1>Page not found</h1>
    <p>We rebuilt the GNDA website, so some old links no longer work. One of these should get you where you were going.</p>
    <ul class="go" id="go"></ul>
  </div>
</main>
<script>
(function(){
  var L = [["Home", "index.html", "Events and announcements"],
           ["Leagues", "league/index.html", "How to join, registration"],
           ["Standings", "league/stats/index.html#standings", "Teams and players"],
           ["Venues", "venues/index.html", "League bars and blind draws"],
           ["Store", "store/index.html", "Membership and fees"],
           ["About", "about/index.html", "Board, by-laws, contact"]];
  document.getElementById("go").innerHTML = L.map(function(x){
    return '<li><a href="'+GNDA_BASE+x[1]+'">'+x[0]+'<small>'+x[2]+'</small></a></li>';
  }).join("");
})();
</script>
</body>
</html>
