<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Music City Classic · GNDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<meta name="description" content="The Music City Classic: the Greater Nashville Darting Association's annual steel-tip dart tournament each July.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/pages.css">
<style>
/* Layout: title band; next-tournament and sponsorship panels side by side; last year's dates, prize fund and events; hall of fame (multiple-time champions, then year by year). One column on phones. */
.head{padding-block:32px 4px}
.head .lede{margin-top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:20px 56px;display:grid;gap:44px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;min-width:0}
.panel h2{margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.kv dt{font:600 12px/1.6 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font:700 22px/1.1 var(--display)}
.kv dd.tba{color:var(--muted)}
.panel p{margin:12px 0 0;font-size:14px;color:var(--ink2)}
.price{font:700 46px/1 var(--display);color:var(--green);font-variant-numeric:tabular-nums}
.btn.primary{background:var(--green);color:var(--surface);border:1px solid var(--green)}
.price small{font:600 13px/1 var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}

.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:6px}
.fact{background:var(--surface);padding:12px 14px;min-width:0}
.fact span{display:block;font:600 11px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact b{display:block;font:700 21px/1.15 var(--display);margin-top:3px}


.formats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}
.formats li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule)}
.formats .c{font:700 24px/1 var(--display);color:var(--green);font-variant-numeric:tabular-nums}
.formats b{font-weight:700}
.formats small{display:block;font-size:13px;color:var(--muted)}
.hof-lede{color:var(--muted);font-size:14px;margin:-4px 0 16px}
.g-h{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:0 0 10px}
.g-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.great{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 18px 12px 14px;min-width:0}
.great .n{font:700 44px/1 var(--display);color:var(--green);font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.great b{font:700 20px/1.1 var(--display)}
.great small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.hof{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.hof .yr{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;padding:16px 20px;border-top:1px solid var(--rule);border-left:4px solid var(--green)}
.hof .yr:first-child{border-top:0}
.hof .yr:nth-child(even){border-left-color:var(--red)}
.hof .y{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.hof .tot{display:block;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.res{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 28px}
.res li{display:flex;flex-direction:column;gap:1px;min-width:0}
.res .ev{font:600 11px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.res .ch{font-size:16px}
.res .ru{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.local{display:inline-block;font:600 10px/1 var(--body);letter-spacing:.1em;color:var(--surface);background:var(--green);padding:3px 5px;border-radius:4px;vertical-align:2px;margin-left:6px}
.src{font-size:13px;color:var(--muted);margin:0}
.src a{color:var(--muted)}

@media (max-width:720px){ .cols{grid-template-columns:minmax(0,1fr)} .formats{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){ .res{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .hof .yr{grid-template-columns:minmax(0,1fr);gap:8px;padding:14px 16px} .hof .y{font-size:28px} .hof .tot{display:inline;margin-left:10px} }
@media (max-width:560px){ .head{padding-block:24px 0} }
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="mcc"></script>

<div class="head">
  <div class="wrap">
    <h1 class="sr">Music City Classic</h1>
    <p class="lede" id="intro"></p>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="cols">
      <section class="panel" aria-labelledby="next-h">
        <h2 id="next-h"></h2>
        <dl class="kv" id="next"></dl>
        <p id="next-note"></p>
      </section>
      <section class="panel" aria-labelledby="spons-h">
        <h2 id="spons-h">Sponsor a board</h2>
        <div class="price" id="price"></div>
        <p id="spons"></p>
      </section>
    </div>

    <section aria-labelledby="last-h">
      <p class="eyebrow">Last year, for reference</p>
      <h2 id="last-h" style="margin-top:8px"></h2>
      <div class="facts" id="facts"></div>
      <h3 id="ev-h"></h3>
      <ul class="formats" id="formats"></ul>
    </section>

    <section aria-labelledby="hof-h">
      <h2 id="hof-h">Hall of fame</h2>
      <p class="hof-lede">Singles champions from past Classics.</p>
      <div class="greats" id="greats"></div>
      <ol class="hof" id="hof"></ol>
    </section>

    <p class="src" id="sources"></p>
  </div>
</main>

<script src="../data/mcc.js"></script>
<script>
(function(){
  var M = window.GNDA_MCC || {};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function $(id){return document.getElementById(id)}
  function money(v){return typeof v==="number" ? "$"+v : esc(v)}
  function mapLink(name,address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((name?name+", ":"")+address)}
  function tba(v){return !v || /^tba$/i.test(String(v).trim())}

  $("intro").textContent = M.intro || "";

  // Next tournament
  var n = M.next || {};
  $("next-h").textContent = (n.year||"") + " Music City Classic";
  $("next").innerHTML = [["Dates",n.dates],["Venue",n.venue]].map(function(r){
    return '<dt>'+r[0]+'</dt><dd'+(tba(r[1])?' class="tba"':'')+'>'+(tba(r[1])?"To be announced":esc(r[1]))+'</dd>';
  }).join("");
  $("next-note").textContent = n.note || "";

  // Sponsorship
  var sp = M.sponsorship || {};
  $("price").innerHTML = esc(sp.price||"")+'<small>per board</small>';
  $("spons").textContent = sp.text || "";
  if(sp.link){ $("spons").insertAdjacentHTML("afterend", '<p><a class="btn primary" href="../'+esc(sp.link)+'">'+esc(sp.linkText||"Sponsor a board")+'</a></p>'); }

  // Last year's tournament
  var L = M.last || {};
  $("last-h").textContent = L.title || "";
  $("facts").innerHTML = [["Dates", L.dates], ["Prize fund", L.prizeFund]].filter(function(f){return f[1]})
    .map(function(f){return '<div class="fact"><span>'+f[0]+'</span><b>'+esc(f[1])+'</b></div>'}).join("");
  var F = L.formats || [];
  var total = L.eventsTotal || F.reduce(function(n,f){return n+(f.count||0)},0);
  $("ev-h").textContent = total ? total+" events" : "Events";
  $("formats").innerHTML = F.map(function(f){
    return '<li><span class="c">'+esc(f.count||"")+'</span><span><b>'+esc(f.name)+'</b>'+(f.detail?'<small>'+esc(f.detail)+'</small>':'')+'</span></li>';
  }).join("");

  // Hall of fame
  var HOF = (M.hallOfFame||[]).slice().sort(function(a,b){return b.year-a.year});
  function base(n){return String(n||"").replace(/\s*\(.*?\)\s*$/,"").trim()}

  // Multiple-time champions, worked out from the results below
  var titles = {};
  HOF.forEach(function(y){ (y.results||[]).forEach(function(r){
    var k = base(r.champion); (titles[k] = titles[k] || {name:k, wins:[]}).wins.push({year:y.year, event:r.event});
  }); });
  var greats = Object.keys(titles).map(function(k){return titles[k]}).filter(function(t){return t.wins.length>1})
    .sort(function(a,b){return b.wins.length-a.wins.length || a.name.localeCompare(b.name)});
  $("greats").innerHTML = greats.length ? '<p class="g-h">Multiple-time champions</p><div class="g-row">'+greats.map(function(g){
    var per = {}; g.wins.forEach(function(w){ per[w.year]=(per[w.year]||0)+1; });
    var years = Object.keys(per).sort().map(function(y){return per[y]>1 ? y+" ("+per[y]+")" : y}).join(" · ");
    return '<div class="great"><b class="n">'+g.wins.length+'</b><span><b>'+esc(g.name)+'</b><small>'+g.wins.length+' titles: '+esc(years)+'</small></span></div>';
  }).join("")+'</div>' : "";

  $("hof").innerHTML = HOF.map(function(y){
    var R = y.results||[], total = R.reduce(function(n,r){return n+(r.field||0)},0);
    var res = R.map(function(r){
      return '<li><span class="ev">'+esc(r.event)+'</span><b class="ch">'+esc(r.champion)+(r.local?'<span class="local" title="Greater Nashville Darting Association">GNDA</span>':'')+'</b>'+
        (r.field?'<span class="ru">'+esc(r.field)+' entries</span>':'')+'</li>';
    }).join("");
    return '<li class="yr"><div><b class="y">'+esc(y.year)+'</b>'+(total?'<span class="tot">'+total+' singles entries</span>':'')+'</div><div>'+(res?'<ul class="res">'+res+'</ul>':'')+'</div></li>';
  }).join("");

  // Sources
  var src = M.sources||[];
  $("sources").innerHTML = src.length ? "Results from: "+src.map(function(s){return '<a href="'+esc(s.url)+'" rel="noopener">'+esc(s.label)+'</a>'}).join(", ")+"." : "";
})();
</script>
</body>
</html>
