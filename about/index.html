<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>About · GNDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<meta name="description" content="The GNDA board of directors, board meetings and elections, the Rules & By-Laws, meeting minutes, and how to contact the board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/pages.css">
<style>
/* About layout: board of directors as a card grid; below it, meetings & elections (wide) beside
   documents, minutes and contact (narrow). One column on phones. */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px}

.board{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.person .role{font:600 11px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.person b{font:700 21px/1.1 var(--display);letter-spacing:.01em}

.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px 48px;align-items:start;margin-top:44px}
.gov{margin:0;padding-left:18px;color:var(--ink2);line-height:1.6;max-width:68ch}
.gov li+li{margin-top:8px}
.side{display:grid;gap:36px;min-width:0}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{border-bottom:1px solid var(--rule)}
.list a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 2px;text-decoration:none;color:var(--ink)}
.list a:hover b{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.list b{font-weight:700;font-size:15px}
.list small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.go{font-size:13px;font-weight:600;color:var(--link);white-space:nowrap}
h3.minor{margin:20px 0 8px;font-size:16px}

.contact{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;scroll-margin-top:90px}
.contact p{margin:0 0 12px;color:var(--ink2);font-size:15px}
.btn.primary{background:var(--green);color:var(--surface);border:1px solid var(--green)}
.soon{display:inline-block;font-weight:600;font-size:14px;color:var(--muted)}

@media (max-width:820px){ .cols{grid-template-columns:minmax(0,1fr);gap:36px} }
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="about"></script>
<h1 class="sr">About the GNDA board</h1>

<main>
  <div class="wrap">
    <section aria-labelledby="board-h">
      <h2 id="board-h"></h2>
      <ul class="board" id="board"></ul>
    </section>

    <div class="cols">
      <section aria-labelledby="gov-h">
        <h2 id="gov-h">Board meetings and elections</h2>
        <ul class="gov" id="gov"></ul>
      </section>

      <div class="side">
        <section class="contact" id="contact" aria-labelledby="contact-h">
          <h2 id="contact-h">Contact the board</h2>
          <p id="contact-text"></p>
          <div id="contact-action"></div>
        </section>

        <section aria-labelledby="docs-h">
          <h2 id="docs-h">Documents</h2>
          <ul class="list" id="docs"></ul>
          <h3 class="minor">Meeting minutes</h3>
          <ul class="list" id="mins"></ul>
        </section>
      </div>
    </div>
  </div>
</main>

<script src="../data/about.js"></script>
<script src="../data/sheet.js"></script>
<script>
(function(){
  var A = window.GNDA_ABOUT || {};
  var MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function $(id){return document.getElementById(id)}
  function link(l){l=String(l||""); return /^https?:\/\//i.test(l) ? l : (l ? "../"+l : "")}
  function longDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?MON[+m[2]-1]+" "+(+m[3])+", "+m[1]:esc(s)}
  function isPdf(l){return /\.pdf($|\?)/i.test(l||"")}

  $("board-h").textContent = A.boardTitle || "Board of Directors";
  $("board").innerHTML = (A.board||[]).map(function(p){
    return '<li class="person"><span class="role">'+esc(p.role)+'</span><b>'+esc(p.name)+'</b></li>';
  }).join("") || '<li><p class="empty">Board list coming soon.</p></li>';

  $("gov").innerHTML = (A.governance||[]).map(function(g){return "<li>"+esc(g)+"</li>"}).join("");

  var c = A.contact || {};
  $("contact-text").textContent = c.text || "";
  $("contact-action").innerHTML = c.link
    ? '<a class="btn primary" href="'+esc(link(c.link))+'" rel="noopener">'+esc(c.linkText||"Contact the board")+'</a>'
    : '<span class="soon">Contact form coming soon</span>';

  $("docs").innerHTML = (A.documents||[]).map(function(d){
    return '<li><a href="'+esc(link(d.link))+'" rel="noopener"><span><b>'+esc(d.title)+'</b>'+(d.note?'<small>'+esc(d.note)+'</small>':'')+'</span>'+
      '<span class="go">'+(isPdf(d.link)?"PDF":"Open")+' →</span></a></li>';
  }).join("") || '<li><p class="empty">Documents coming soon.</p></li>';

  $("mins").innerHTML = (A.minutes||[]).slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).map(function(m){
    return '<li><a href="'+esc(link(m.link))+'" rel="noopener"><b>'+longDate(m.date)+'</b><span class="go">Read →</span></a></li>';
  }).join("") || '<li><p class="empty">No minutes posted yet.</p></li>';
})();
</script>
</body>
</html>
