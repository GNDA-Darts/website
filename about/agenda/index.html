<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Submit an agenda item · GNDA</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<meta name="description" content="Submit an item for the agenda of the next GNDA board meeting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px;max-width:760px}
.lead{font-size:clamp(16px,1.9vw,18px);line-height:1.55;max-width:62ch;margin:0}
.note{color:var(--ink2);font-size:15px;margin:8px 0 0;max-width:62ch}
.btn.primary{background:var(--green);color:var(--surface);border:1px solid var(--green);cursor:pointer}
.btn[disabled]{opacity:.6;cursor:default;filter:none}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;margin-top:22px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fields .wide{grid-column:1/-1}
label,legend{display:block;font:600 14px/1.3 var(--body);color:var(--ink)}
.hint{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:3px}
input,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #BDB9AF;border-radius:8px;background:var(--surface);color:var(--ink);font:16px/1.4 var(--body)}
textarea{min-height:150px;resize:vertical}
.count{display:block;text-align:right;font-weight:400;color:var(--muted);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
fieldset{border:0;margin:0;padding:0;min-width:0}
.choice{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:11px 12px;border:1px solid var(--rule);border-radius:8px;font-weight:400;cursor:pointer}
.choice:hover{background:var(--sunk)}
.choice input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--green)}
.choice:has(input:checked){border-color:var(--green);background:var(--sunk)}
input:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.choice:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
[aria-invalid="true"]{border-color:var(--red)}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.actions .small{color:var(--muted);font-size:13px;margin:0}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#errs{scroll-margin-top:90px}
.errors{margin:22px 0 0;padding:12px 16px;border:1px solid var(--red);border-radius:10px;background:var(--red-soft);color:var(--ink);font-size:15px}
.errors ul{margin:6px 0 0;padding-left:20px}
.done h2{font-size:28px;margin:0 0 8px}
.done p{margin:8px 0 0;color:var(--ink2);max-width:62ch}
.done .btn{margin-top:18px}
@media (max-width:520px){ .fields{grid-template-columns:minmax(0,1fr)} .card{padding:16px} }
</style>
</head>
<body>
<script src="../../assets/site.js" data-root="../../" data-page="about"></script>
<h1 class="sr">Submit an agenda item</h1>

<main>
  <div class="wrap" id="app"><p class="lead">Loading…</p></div>
</main>
<script src="../../data/forms.js"></script>
<script>
(function(){
  var F = window.GNDA_FORMS || {}, app = document.getElementById("app"), loaded = Date.now();
  var CONTACT = F.contact || "gndadarts@gmail.com", MAX = 1000;
  var W = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var M = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

  // Same rule as the Sheet's script: meetings are the third Monday; items received by the Friday before
  // (Central time) go on that meeting's agenda, later ones on the next month's.
  function iso(d){ return d.toISOString().slice(0,10); }
  function thirdMonday(y,m){ var w = new Date(Date.UTC(y,m,1)).getUTCDay(); return new Date(Date.UTC(y,m,1+((8-w)%7)+14)); }
  function nextMeeting(today){
    var p = today.split("-").map(Number), y = p[0], m = p[1]-1;
    for(var i=0;i<2;i++){
      var meet = thirdMonday(y,m), cut = new Date(meet.getTime()-3*864e5);
      if(today <= iso(cut)) return { meeting: iso(meet), cutoff: iso(cut) };
      if(++m > 11){ m = 0; y++; }
    }
  }
  function nice(s, withDay){ var d = new Date(s+"T12:00:00Z"); return (withDay===false?"":W[d.getUTCDay()]+", ")+M[d.getUTCMonth()]+" "+d.getUTCDate(); }
  var today = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  var when = nextMeeting(today);

  var intro = '<p class="lead">Have something you\'d like the board to discuss? Submit it here for the board meeting on <strong>'+esc(nice(when.meeting))+' at 7:30 pm</strong>.</p>'+
    '<p class="note">Items received by '+esc(nice(when.cutoff))+' go on that meeting\'s agenda; later items go to the following month. Board meetings are open to the public.</p>';

  if(!F.endpoint){
    app.innerHTML = intro + '<div class="card"><p class="lead">Online submission isn\'t available yet. Email your item to <a href="mailto:'+esc(CONTACT)+'">'+esc(CONTACT)+'</a>.</p></div>';
    return;
  }

  app.innerHTML = intro +
    '<div id="errs"></div>'+
    '<form id="f" class="card" novalidate>'+
      '<div class="fields">'+
        '<label>Name<input name="name" maxlength="60" required autocomplete="name"></label>'+
        '<label>Email<input name="email" type="email" maxlength="100" required autocomplete="email"></label>'+
        '<div class="wide"><label for="summary">Summary</label><span class="hint" id="sum-hint">What\'s the issue, and what would you like the board to do?</span>'+
          '<textarea id="summary" name="summary" maxlength="'+MAX+'" required aria-describedby="sum-hint sum-count"></textarea>'+
          '<span class="count" id="sum-count">0 / '+MAX+'</span></div>'+
        '<fieldset class="wide" id="handling"><legend>How would you like this handled?</legend>'+
          '<label class="choice"><input type="radio" name="handling" value="present" required> I\'d like to be at the meeting to present it</label>'+
          '<label class="choice"><input type="radio" name="handling" value="without"> It\'s ok for the board to discuss this without me and let me know the outcome</label>'+
        '</fieldset>'+
        '<label class="trap" aria-hidden="true">Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label>'+
      '</div>'+
      '<div class="actions"><button class="btn primary" id="go" type="submit">Submit agenda item</button>'+
        '<p class="small">It goes to the board by email.</p></div>'+
    '</form>';

  var f = document.getElementById("f"), go = document.getElementById("go"), sum = f.elements.summary;
  sum.addEventListener("input", function(){ document.getElementById("sum-count").textContent = sum.value.length+" / "+MAX; });

  function showErrors(list){
    var box = document.getElementById("errs");
    box.innerHTML = list.length ? '<div class="errors" role="alert" tabindex="-1"><strong>Please fix:</strong><ul>'+list.map(function(e){ return "<li>"+e+"</li>"; }).join("")+"</ul></div>" : "";
    if(list.length){ box.firstChild.focus(); box.scrollIntoView({block:"start"}); }
  }
  function busy(on){ go.disabled = on; go.textContent = on ? "Sending…" : "Submit agenda item"; }

  f.addEventListener("submit", function(e){
    e.preventDefault();
    var errs = [], el = f.elements;
    function check(input, bad, msg){ input.setAttribute("aria-invalid", bad?"true":"false"); if(bad) errs.push(msg); }
    check(el.name, !el.name.value.trim(), "Enter your name.");
    check(el.email, !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.email.value.trim()), "Enter a valid email address.");
    check(sum, !sum.value.trim(), "Describe the item for the board.");
    var h = f.querySelector('input[name="handling"]:checked');
    document.getElementById("handling").setAttribute("aria-invalid", h?"false":"true");
    if(!h) errs.push("Choose how you would like the item handled.");
    if(errs.length) return showErrors(errs.map(esc));
    showErrors([]); busy(true);

    var data = { type:"agenda", name: el.name.value, email: el.email.value, summary: sum.value,
      handling: h.value, website: el.website.value, ms: Date.now()-loaded };
    function failed(){
      showErrors(["Couldn't send your item. Please try again, or email it to <a href=\"mailto:"+esc(CONTACT)+"\">"+esc(CONTACT)+"</a>. What you typed is still here."]);
      busy(false);
    }
    // Plain-text body keeps this a simple request (no preflight), which Apps Script web apps accept.
    fetch(F.endpoint, { method:"POST", body: JSON.stringify(data) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res.ok){ if(res.errors) { showErrors(res.errors.map(esc)); busy(false); } else failed(); return; }
        var meet = res.meeting || when.meeting, present = h.value === "present";
        app.innerHTML = '<div class="done"><h2>Thanks, it\'s in</h2>'+
          '<p>Your item has been sent to the board for the meeting on <strong>'+esc(nice(meet))+' at 7:30 pm</strong>.</p>'+
          '<p>'+(present ? "You're welcome to attend and present it; meetings are open to the public."
                         : "The board will discuss it and let you know the outcome by email.")+'</p>'+
          '<a class="btn ghost" href="../index.html">About the board</a></div>';
        window.scrollTo(0,0);
      })
      .catch(failed);
  });
})();
</script>
</body>
</html>
