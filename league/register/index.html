<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Register · GNDA</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<meta name="description" content="Register a GNDA league team and pay the session fee online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px}
.lead{font-size:clamp(16px,1.9vw,18px);line-height:1.55;max-width:62ch;margin:0}
.note{color:var(--ink2);font-size:15px;margin:8px 0 0;max-width:62ch}
.test{margin:0 0 18px;padding:10px 14px;border-radius:8px;background:var(--red-soft);color:var(--ink);font-size:14px;font-weight:600}
.btn.primary{background:var(--green);color:var(--surface);border:1px solid var(--green);cursor:pointer}
.btn[disabled]{opacity:.6;cursor:default;filter:none}
/* Form (left) and the running total (right); one column on phones, with the total above the button. */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start;margin-top:26px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;min-width:0}
.card+.card{margin-top:14px}
.card h2{font-size:22px;margin:0 0 4px}
.card h2 .opt{font:400 15px/1 var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.card .hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fields .wide{grid-column:1/-1}
label{display:block;font:600 14px/1.3 var(--body);color:var(--ink)}
label .opt{font-weight:400;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #BDB9AF;border-radius:8px;background:var(--surface);color:var(--ink);font:16px/1.3 var(--body)}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,.x:focus-visible,.add:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--red)}
.players{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:p}
.players li{display:grid;grid-template-columns:28px minmax(0,1fr) 36px;gap:8px;align-items:center;counter-increment:p}
.players li::before{content:counter(p);font:700 20px/1 var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.players input{margin:0}
.x{width:36px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.x:hover{background:var(--sunk);color:var(--ink)}
.add{margin-top:12px;padding:8px 12px;border:1px dashed #BDB9AF;border-radius:8px;background:transparent;color:var(--link);font:600 14px/1 var(--body);cursor:pointer}
.add:hover{background:var(--sunk)}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sum{position:sticky;top:calc(var(--top-h,0px) + 70px)}
.sum dl{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:10px 0 0;font-size:15px}
.sum dt{color:var(--ink2)} .sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.total span{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.total strong{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.sum .btn{width:100%;justify-content:center;margin-top:16px}
.sum .small{color:var(--muted);font-size:13px;margin:10px 0 0}
.errors{margin:0 0 16px;padding:12px 16px;border:1px solid var(--red);border-radius:10px;background:var(--red-soft);color:var(--ink);font-size:15px}
.errors ul{margin:6px 0 0;padding-left:20px}
.status{max-width:560px}
.status h2{font-size:28px;margin:0 0 8px}
.status p{margin:8px 0 0;color:var(--ink2)}
.status .btn{margin-top:16px}
@media (max-width:820px){ .layout{grid-template-columns:minmax(0,1fr)} .sum{position:static} }
@media (max-width:520px){ .fields{grid-template-columns:minmax(0,1fr)} .card{padding:16px} }
</style>
</head>
<body>
<script src="../../assets/site.js" data-root="../../" data-page="league" data-sub="register"></script>
<h1 class="sr">Register a team</h1>

<main>
  <div class="wrap" id="app">
    <p class="lead">Loading…</p>
  </div>
</main>
<script src="../../data/register.js"></script>
<script>
(function(){
  var C = window.GNDA_REGISTER || {}, app = document.getElementById("app");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function money(n){ n=Math.round(n*100)/100; return "$"+(n%1 ? n.toFixed(2) : String(n)); }
  function get(params){
    var u = C.endpoint + (params ? "?"+params : "");
    return fetch(u).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function testBanner(on){ return on ? '<p class="test">Test mode: payments go to Square\'s sandbox. Use test card 4111 1111 1111 1111; no real money moves.</p>' : ""; }
  function unavailable(text){
    app.innerHTML = '<div class="status"><p class="lead">'+esc(text || C.closedText)+'</p><p class="note">Questions: <a href="mailto:'+esc(C.contact)+'">'+esc(C.contact)+'</a></p></div>';
  }
  if(!C.endpoint){ unavailable("Online team registration isn't available yet."); return; }

  var q = new URLSearchParams(location.search);
  if(q.get("r") && q.get("k")) showStatus(q.get("r"), q.get("k"), 0);
  else get("").then(function(cfg){ if(cfg.ok && cfg.open) showForm(cfg); else unavailable(); })
              .catch(function(){ unavailable("The registration form couldn't load. Please try again in a few minutes."); });

  // ---------- After paying: Square sends the captain back here with ?r=R001&k=... ----------
  function showStatus(id, key, tries){
    get("action=status&r="+encodeURIComponent(id)+"&k="+encodeURIComponent(key)).then(function(s){
      if(!s.ok){ unavailable("We couldn't find that registration. If you paid, check your email for Square's receipt and contact the board."); return; }
      var what = esc(s.players)+" players, "+esc(s.amount);
      if(s.status==="Paid"){
        app.innerHTML = testBanner(s.test)+'<div class="status"><h2>You\'re registered</h2><p><strong>'+esc(s.team)+'</strong> is registered for the '+esc(s.session)+' session ('+what+' paid).</p>'+
          '<p>A confirmation email is on its way to the captain. Square sends the payment receipt separately.</p>'+
          '<a class="btn ghost" href="../index.html">League overview</a></div>';
      } else if(s.status==="Unpaid" && tries < 3){
        app.innerHTML = testBanner(s.test)+'<div class="status"><h2>Checking your payment…</h2><p>This takes a few seconds.</p></div>';
        setTimeout(function(){ showStatus(id, key, tries+1); }, 4000);
      } else if(s.status==="Unpaid"){
        app.innerHTML = testBanner(s.test)+'<div class="status"><h2>Payment not received yet</h2><p><strong>'+esc(s.team)+'</strong> is saved for the '+esc(s.session)+' session ('+what+'), but we haven\'t seen the payment.</p>'+
          '<p>If you just paid, it can take a few minutes: you\'ll get a confirmation email once it comes through. Otherwise, finish paying here:</p>'+
          (s.pay ? '<a class="btn primary" href="'+esc(s.pay)+'">Pay '+esc(s.amount)+'</a>' : '')+'</div>';
      } else {
        unavailable("This registration is marked "+s.status.toLowerCase()+". Please contact the board.");
      }
    }).catch(function(){ unavailable("We couldn't check your payment just now. If you paid, you'll get a confirmation email shortly."); });
  }

  // ---------- The form ----------
  function showForm(cfg){
    function opts(list, ph){ return '<option value="">'+esc(ph)+'</option>'+list.map(function(v){ return '<option>'+esc(v)+'</option>'; }).join(""); }
    app.innerHTML = testBanner(cfg.test)+
      '<p class="lead">Register your team for the <strong>'+esc(cfg.session)+'</strong> session and pay the session fee in one step: '+
        esc(money(cfg.fee))+' per player, '+esc(cfg.min)+' to '+esc(cfg.max)+' players. You\'ll pay by card on Square\'s secure page.</p>'+
      (cfg.note ? '<p class="note">'+esc(cfg.note)+'</p>' : '')+
      '<form id="f" class="layout" novalidate>'+
        '<div>'+
          '<div id="errs"></div>'+
          '<section class="card" aria-labelledby="t-h"><h2 id="t-h">Team</h2>'+
            '<div class="fields">'+
              '<label class="wide">Team name<input name="team" maxlength="40" required autocomplete="off"></label>'+
              (cfg.divisions.length ? '<label>Division requested<select name="division" required>'+opts(cfg.divisions,"Choose…")+'</select></label>' : '')+
              '<label>Home venue<select name="venue" required>'+opts(cfg.venues,"Choose…")+'</select></label>'+
            '</div></section>'+
          '<section class="card" aria-labelledby="c-h"><h2 id="c-h">Captain</h2>'+
            '<div class="fields">'+
              '<label class="wide">Name<input name="captain" maxlength="50" required autocomplete="name"></label>'+
              '<label>Email<input name="email" type="email" maxlength="100" required autocomplete="email"></label>'+
              '<label>Phone<input name="phone" type="tel" maxlength="30" required autocomplete="tel"></label>'+
            '</div></section>'+
          '<section class="card" aria-labelledby="p-h"><h2 id="p-h">Players</h2>'+
            '<p class="hint">Everyone on the roster, including the captain if they play. You pay for each player listed.</p>'+
            '<ol class="players" id="pl"></ol>'+
            '<button type="button" class="add" id="add">+ Add a player</button>'+
          '</section>'+
          '<section class="card" aria-labelledby="n-h"><h2 id="n-h">Notes <span class="opt">(optional)</span></h2>'+
            '<label><span class="sr">Notes for the board</span><textarea name="notes" maxlength="500" placeholder="Anything the board should know: scheduling, a player still to be added, a question."></textarea></label>'+
            '<label class="trap" aria-hidden="true">Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label>'+
          '</section>'+
        '</div>'+
        '<aside class="card sum" aria-labelledby="s-h"><h2 id="s-h">Session fee</h2>'+
          '<dl><dt>Players</dt><dd id="n">0</dd><dt>Per player</dt><dd>'+esc(money(cfg.fee))+'</dd></dl>'+
          '<div class="total"><span>Total</span><strong id="tot">$0</strong></div>'+
          '<button class="btn primary" id="go" type="submit">Continue to payment</button>'+
          '<p class="small">Your registration is saved, then you\'re taken to Square to pay. It\'s complete once payment goes through.</p>'+
        '</aside>'+
      '</form>';

    var f = document.getElementById("f"), pl = document.getElementById("pl"), add = document.getElementById("add");
    function rows(){ return pl.querySelectorAll("li"); }
    function addRow(focus){
      var li = document.createElement("li");
      li.innerHTML = '<input aria-label="Player name" maxlength="50" autocomplete="off"><button type="button" class="x" aria-label="Remove player">&times;</button>';
      pl.appendChild(li); sync();
      if(focus) li.querySelector("input").focus();
    }
    function names(){ return Array.prototype.map.call(pl.querySelectorAll("input"), function(i){ return i.value.trim(); }).filter(String); }
    function sync(){
      var all = rows(), n = names().length;
      Array.prototype.forEach.call(all, function(li){ li.querySelector(".x").hidden = all.length <= cfg.min; });
      add.hidden = all.length >= cfg.max;
      document.getElementById("n").textContent = n;
      document.getElementById("tot").textContent = money(n*cfg.fee);
    }
    for(var i=0;i<cfg.min;i++) addRow(false);
    add.addEventListener("click", function(){ addRow(true); });
    pl.addEventListener("click", function(e){ var b=e.target.closest(".x"); if(b){ b.parentNode.remove(); sync(); } });
    pl.addEventListener("input", sync);

    function showErrors(list){
      var box = document.getElementById("errs");
      box.innerHTML = list.length ? '<div class="errors" role="alert" tabindex="-1"><strong>Please fix:</strong><ul>'+list.map(function(e){ return '<li>'+esc(e)+'</li>'; }).join("")+'</ul></div>' : "";
      if(list.length){ box.firstChild.focus(); box.scrollIntoView({block:"start"}); }
    }
    f.addEventListener("submit", function(e){
      e.preventDefault();
      var errs = [];
      Array.prototype.forEach.call(f.querySelectorAll("[required]"), function(el){
        var bad = !el.value.trim() || (el.type==="email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim()));
        el.setAttribute("aria-invalid", bad ? "true" : "false");
        if(bad) errs.push((el.closest("label").firstChild.textContent||"A field")+" is missing or not valid.");
      });
      var ps = names(), low = ps.map(function(p){ return p.toLowerCase(); });
      if(ps.length < cfg.min || ps.length > cfg.max) errs.push("List "+cfg.min+" to "+cfg.max+" players (you listed "+ps.length+").");
      if(low.some(function(p,i){ return low.indexOf(p) !== i; })) errs.push("A player is listed twice.");
      if(errs.length) return showErrors(errs);
      showErrors([]);

      var go = document.getElementById("go");
      go.disabled = true; go.textContent = "Opening payment page…";
      var data = { type:"register", players: ps, returnTo: location.href.split(/[?#]/)[0] };
      ["team","division","venue","captain","email","phone","notes","website"].forEach(function(k){ if(f.elements[k]) data[k] = f.elements[k].value; });
      // Plain-text body keeps this a simple request (no preflight), which Apps Script web apps accept.
      fetch(C.endpoint, { method:"POST", body: JSON.stringify(data) })
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(res.ok && res.url){ location.href = res.url; return; }
          showErrors(res.errors || ["Something went wrong. Please try again."]);
          go.disabled = false; go.textContent = "Continue to payment";
        })
        .catch(function(){
          showErrors(["Couldn't reach the registration system. Check your connection and try again."]);
          go.disabled = false; go.textContent = "Continue to payment";
        });
    });
  }
})();
</script>
</body>
</html>
