<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rules · GNDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<meta name="description" content="Key GNDA league rules, a link to the full Rules & By-Laws, and the league-night checklist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px}
/* Rules: key rules as a row of cards, then the league-night checklist. One column on phones. */
.sub{color:var(--muted);font-size:14px;margin:-4px 0 14px;max-width:72ch}
.sub a{font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;min-width:0}
.kcard h3{margin:0 0 8px;color:var(--ink)}
.kcard ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px;line-height:1.5}
.kcard li+li{margin-top:6px}
.chk{margin-top:44px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:10px 14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;color:var(--ink2)}
.steps li::before{content:counter(s);font:700 24px/1 var(--display);color:var(--green);font-variant-numeric:tabular-nums}
@media (max-width:820px){ .kgrid,.steps{grid-template-columns:minmax(0,1fr)} .steps{grid-auto-flow:row;grid-template-rows:none} }
</style>
</head>
<body>
<script src="../../assets/site.js" data-root="../../" data-page="league" data-sub="rules"></script>
<h1 class="sr">League rules</h1>

<main>
  <div class="wrap">
    <section aria-labelledby="keys-h">
      <h2 id="keys-h">Key rules</h2>
      <p class="sub" id="keys-note"></p>
      <div class="kgrid" id="keys"></div>
    </section>

    <section class="chk" aria-labelledby="chk-h">
      <h2 id="chk-h">League-night checklist</h2>
      <p class="sub" id="chk-intro"></p>
      <ol class="steps" id="checklist"></ol>
    </section>
  </div>
</main>
<script src="../../data/league.js"></script>
<script>
(function(){
  var L = window.GNDA_LEAGUE || {};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function $(id){return document.getElementById(id)}
  function link(l){l=String(l||""); return /^https?:\/\//i.test(l) ? l : (l ? "../../"+l : "")}
  function linkify(t){
    return esc(t).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, txt, url){ return '<a href="'+esc(link(url))+'" rel="noopener">'+txt+'</a>'; });
  }
  $("chk-intro").innerHTML = linkify(L.checklistIntro || "");
  $("keys-note").innerHTML = linkify(L.keyRulesNote || "");
  $("keys").innerHTML = (L.keyRules||[]).map(function(g){
    return '<div class="kcard"><h3>'+esc(g.title)+'</h3><ul>'+(g.items||[]).map(function(i){return '<li>'+linkify(i)+'</li>'}).join("")+'</ul></div>';
  }).join("");
  $("checklist").innerHTML = (L.checklist||[]).map(function(c){return '<li><span>'+linkify(c)+'</span></li>'}).join("");
})();
</script>
</body>
</html>
