<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Singles rules · GNDA</title>
<link rel="icon" type="image/png" href="../../../assets/favicon.png">
<meta name="description" content="GNDA singles league rules: match format by division, deadline, standings and playoffs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../../assets/site.css">
<link rel="stylesheet" href="../../../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px}
/* Rules: key rules as a row of cards, then the league-night checklist. One column on phones. */
.sub{color:var(--muted);font-size:14px;margin:-4px 0 14px;max-width:72ch}
.sub a{font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;min-width:0}
.kcard h3{margin:0 0 8px;color:var(--ink)}
.kcard ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px;line-height:1.5}
.kcard li+li{margin-top:6px}
.chk{margin-top:44px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:10px 14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;color:var(--ink2)}
.steps li::before{content:counter(s);font:700 24px/1 var(--display);color:var(--green);font-variant-numeric:tabular-nums}
@media (max-width:820px){ .kgrid,.steps{grid-template-columns:minmax(0,1fr)} .steps{grid-auto-flow:row;grid-template-rows:none} }
.divs{width:100%;max-width:820px;border-collapse:collapse;margin:0 0 8px;font-size:15px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.divs th,.divs td{text-align:left;padding:10px 14px;border-top:1px solid var(--rule);vertical-align:top}
.divs thead th{border-top:0;font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.divs td:first-child{font-weight:700;white-space:nowrap}
.sec{margin-top:40px}
.lead2{color:var(--ink2);max-width:72ch;margin:0}
@media (max-width:520px){ .divs thead{display:none} .divs tr{display:block;border-top:1px solid var(--rule);padding:8px 12px} .divs tr:first-child{border-top:0} .divs td{display:block;border:0;padding:2px 0} }
</style>
</head>
<body>
<script src="../../../assets/site.js" data-root="../../../" data-page="league" data-sub="s-rules"></script>
<h1 class="sr">Singles league rules</h1>
<main>
  <div class="wrap">
    <h2>Match format</h2>
    <table class="divs"><thead><tr><th>Division</th><th>Match</th><th>Standings by</th></tr></thead><tbody id="divs"></tbody></table>
    <section class="sec"><h2>Key rules</h2><div class="kgrid" id="rules"></div></section>
    <section class="sec"><h2>Prizes</h2><p class="lead2" id="prizes"></p></section>
  </div>
</main>
<script src="../../../data/league.js"></script>
<script>
(function(){
  var L = window.GNDA_LEAGUE || {};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  document.getElementById("divs").innerHTML = (L.singlesDivisions||[]).map(function(d){return '<tr><td>'+esc(d.division)+'</td><td>'+esc(d.match)+'</td><td>'+esc(d.ranked)+'</td></tr>'}).join("");
  document.getElementById("rules").innerHTML = (L.singlesRules||[]).map(function(k){
    return '<div class="kcard"><h3>'+esc(k.title)+'</h3><ul>'+k.items.map(function(i){return '<li>'+esc(i)+'</li>'}).join("")+'</ul></div>';
  }).join("");
  document.getElementById("prizes").textContent = L.singlesPrizes || "";
})();
</script>
</body>
</html>
