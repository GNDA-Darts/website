<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Singles · GNDA</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<meta name="description" content="GNDA singles league standings and matches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:0 56px}
/* Pickers: same bar as the team stats page */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,0px));z-index:5;background:var(--ground);padding-block:10px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar label{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar select{padding:8px 10px;border:1px solid #BDB9AF;border-radius:8px;background:var(--surface);color:var(--ink);font:600 15px/1.2 var(--body);text-transform:none;letter-spacing:0}
.mock{margin:16px 0 0;padding:10px 14px;border-radius:8px;background:var(--sunk);color:var(--ink2);font-size:14px;font-weight:600}
/* Deadline and progress */
.due{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;margin:18px 0 6px}
.due b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.due span{color:var(--muted);font-size:14px}
.meter{height:6px;border-radius:3px;background:var(--sunk);max-width:420px;overflow:hidden;margin:0 0 4px}
.meter i{display:block;height:100%;background:var(--green)}
.note{color:var(--ink2);font-size:14px;margin:14px 0 10px;max-width:80ch}
.grp-h{font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:26px 0 10px}
/* Tables */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--rule)}
thead th{border-top:0;font:600 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
th.l,td.l{text-align:left}
td.rk{width:52px;text-align:center;font-weight:700;color:var(--muted)}
tr:nth-child(-n+3) td.rk{color:var(--green)}
td.pl{font-weight:700;width:40%}
tr.cut td{border-bottom:2px solid var(--ink)}
/* Crosstable */
.x th,.x td{text-align:center;padding:6px}
.x td.nm{text-align:left;font-weight:700;position:sticky;left:0;background:var(--surface);padding-left:12px;min-width:150px}
.x th.nm{position:sticky;left:0;z-index:1}
.x .n{color:var(--muted);font-weight:600;margin-right:8px}
.box{display:block;min-width:56px;padding:6px 4px;border-radius:6px;background:var(--sunk);color:var(--ink);text-decoration:none;font-weight:500}
.box.w{font-weight:800}
.box.todo{background:transparent;border:1px dashed #BDB9AF;color:var(--muted)}
.box.self{background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 4px,var(--surface) 4px,var(--surface) 8px)}
a.box:hover{background:var(--ink);color:var(--surface)}
.todo-list{columns:2 260px;margin:12px 0 0;padding:0;list-style:none;font-size:15px}
.todo-list li{padding:6px 0;border-bottom:1px solid var(--rule);break-inside:avoid}
.todo-list .vs{color:var(--muted);margin:0 6px}
h3.small{font:700 17px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:22px 0 0}
[hidden]{display:none!important}
@media (max-width:560px){ .bar{top:env(safe-area-inset-top,0px)} td.pl{width:auto} }
</style>
</head>
<body>
<script src="../../assets/site.js" data-root="../../" data-page="league" data-sub="s-standings"></script>
<h1 class="sr">Singles league</h1>

<main>
  <div class="wrap">
    <div class="bar">
      <label>Session <select><option>Winter 2027</option></select></label>
      <label>Division <select id="div"></select></label>
    </div>
    <p class="mock">Mockup with made-up players and results.</p>
    <div class="due" id="due"></div>
    <div class="meter"><i id="meter"></i></div>
    <div id="view-standings"></div>
    <div id="view-matches" hidden></div>
  </div>
</main>
<script>
(function(){
  // ---------- Sample data (mockup only) ----------
  var seed = 7; function rnd(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }
  var FIRST = ["Alex","Jordan","Casey","Morgan","Riley","Taylor","Jamie","Drew","Quinn","Reese","Avery","Parker","Rowan","Emerson","Hayden","Logan","Skyler","Blake","Cameron","Dakota","Elliot","Finley","Harper","Kendall","Lane","Marley","Noel","Peyton","Sawyer"];
  var LAST = ["Abbott","Barlow","Cutler","Dorsey","Easton","Fenwick","Garland","Holloway","Ingram","Jessup","Keller","Lockhart","Mercer","Norwood","Oakes","Pruitt","Ramsey","Sutton","Thorne","Vance","Whitlock","Yates","Ashby","Bramble","Colby","Delaney","Ellery","Forsyth","Grady"];
  var used = 0;
  function people(n, base){ var a=[]; for(var i=0;i<n;i++,used++) a.push({name:FIRST[used%FIRST.length]+" "+LAST[(used*7)%LAST.length], s:base+rnd()*8-4, ppr:0}); return a; }
  var DIVS = [
    { name:"Division 1", format:"wlt",  legs:11, groups:[{name:"",  players:people(8,62)}] },
    { name:"Division 2", format:"legs", legs:11, groups:[{name:"Group A", players:people(7,50)}, {name:"Group B", players:people(7,50)}] },
    { name:"Division 3", format:"legs", legs:9,  groups:[{name:"",  players:people(6,40)}] }
  ];
  DIVS.forEach(function(d){ d.groups.forEach(function(g){
    var p = g.players, played = 0;
    p.forEach(function(x){ x.ppr = Math.round((x.s + rnd()*3)*10)/10; });
    g.res = {};   // "i-j" (i<j) → [legs i, legs j]
    for(var i=0;i<p.length;i++) for(var j=i+1;j<p.length;j++){
      if(rnd() < 0.38) continue;                       // not played yet
      var pi = p[i].s/(p[i].s+p[j].s), a=0, b=0;
      if(d.format==="wlt"){ while(a<11 && b<11 && a+b<20){ if(rnd()<pi) a++; else b++; } }
      else { for(var k=0;k<d.legs;k++){ if(rnd()<pi) a++; else b++; } }
      g.res[i+"-"+j] = [a,b];
    }
  }); });

  // ---------- Page ----------
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function $(id){return document.getElementById(id)}
  var sel = $("div");
  sel.innerHTML = DIVS.map(function(d,i){return '<option value="'+i+'">'+esc(d.name)+'</option>'}).join("");
  var view = location.hash==="#matches" ? "matches" : "standings";

  function result(g, i, j){ var r = g.res[i<j ? i+"-"+j : j+"-"+i]; if(!r) return null; return i<j ? r : [r[1], r[0]]; }

  function table(d, g){
    var rows = g.players.map(function(p,i){
      var o = {i:i, p:p, pl:0, w:0, l:0, t:0, lf:0, la:0};
      g.players.forEach(function(q,j){ if(i===j) return; var r = result(g,i,j); if(!r) return;
        o.pl++; o.lf+=r[0]; o.la+=r[1];
        if(r[0]>r[1]) o.w++; else if(r[0]<r[1]) o.l++; else o.t++; });
      return o;
    });
    rows.sort(d.format==="wlt" ?
      function(a,b){ return (b.w*2+b.t)-(a.w*2+a.t) || (b.lf-b.la)-(a.lf-a.la); } :
      function(a,b){ return b.lf-a.lf || (b.lf/(b.lf+b.la||1))-(a.lf/(a.lf+a.la||1)); });
    var n = g.players.length-1;
    var head = d.format==="wlt" ?
      '<th>Rank</th><th class="l">Player</th><th>Played</th><th>W</th><th>L</th><th>T</th><th>Legs</th><th>PPR</th>' :
      '<th>Rank</th><th class="l">Player</th><th>Played</th><th>Legs won</th><th>Legs lost</th><th>Leg %</th><th>PPR</th>';
    return '<div class="scroll"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows.map(function(o,k){
      var cells = d.format==="wlt" ?
        '<td>'+o.w+'</td><td>'+o.l+'</td><td>'+o.t+'</td><td>'+o.lf+'–'+o.la+'</td>' :
        '<td><b>'+o.lf+'</b></td><td>'+o.la+'</td><td>'+(o.lf+o.la ? Math.round(100*o.lf/(o.lf+o.la))+'%' : '–')+'</td>';
      return '<tr'+(k===2?' class="cut"':'')+'><td class="rk">'+(k+1)+'</td><td class="l pl">'+esc(o.p.name)+'</td><td>'+o.pl+' of '+n+'</td>'+cells+'<td>'+o.p.ppr.toFixed(1)+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  }

  function matrix(d, g){
    var p = g.players;
    var html = '<div class="scroll"><table class="x"><thead><tr><th class="l nm">Player</th>'+p.map(function(q,j){return '<th title="'+esc(q.name)+'">'+(j+1)+'</th>'}).join("")+'</tr></thead><tbody>'+
      p.map(function(q,i){
        return '<tr><td class="nm"><span class="n">'+(i+1)+'</span>'+esc(q.name)+'</td>'+p.map(function(o,j){
          if(i===j) return '<td><span class="box self" aria-hidden="true">&nbsp;</span></td>';
          var r = result(g,i,j);
          if(!r) return '<td><span class="box todo" title="'+esc(q.name)+' v '+esc(o.name)+': not played yet">–</span></td>';
          var tip = esc(q.name)+' '+r[0]+'–'+r[1]+' '+esc(o.name)+(r[0]>r[1]?' (won)':r[0]<r[1]?' (lost)':' (tie)')+'. Open the match recap';
          return '<td><a class="box'+(r[0]>r[1]?' w':'')+'" href="#matches" title="'+tip+'">'+r[0]+'–'+r[1]+'</a></td>';
        }).join("")+'</tr>';
      }).join("")+'</tbody></table></div>';
    var todo = [];
    for(var i=0;i<p.length;i++) for(var j=i+1;j<p.length;j++) if(!g.res[i+"-"+j]) todo.push('<li>'+esc(p[i].name)+'<span class="vs">v</span>'+esc(p[j].name)+'</li>');
    return html + '<h3 class="small">Still to play ('+todo.length+')</h3>'+(todo.length ? '<ul class="todo-list">'+todo.join("")+'</ul>' : '<p class="note">All matches played.</p>');
  }

  function render(){
    var d = DIVS[+sel.value], tot = 0, done = 0;
    d.groups.forEach(function(g){ var n=g.players.length; tot += n*(n-1)/2; done += Object.keys(g.res).length; });
    $("due").innerHTML = '<div><b>Sun, Mar 7</b> <span>all group matches due</span></div><div><b>'+done+' of '+tot+'</b> <span>matches played</span></div>';
    $("meter").style.width = Math.round(100*done/tot)+"%";
    var fmt = d.format==="wlt" ? "First to 11 legs, or 20 legs played (10–10 is a tie). Ranked by wins, then ties, then leg difference." :
      "Best of "+d.legs+" legs, all "+d.legs+" played. Ranked by legs won.";
    $("view-standings").innerHTML = '<p class="note">'+fmt+' Played counts matches played so far. The top 3 in each group go to the playoffs.</p>'+
      d.groups.map(function(g){ return (g.name?'<h2 class="grp-h">'+esc(g.name)+'</h2>':'')+table(d,g); }).join("");
    $("view-matches").innerHTML = '<p class="note">Each row shows that player\'s legs first. Tap a score to open the match recap. Dashed boxes are still to play; matches can be played in any order before the deadline.</p>'+
      d.groups.map(function(g){ return (g.name?'<h2 class="grp-h">'+esc(g.name)+'</h2>':'')+matrix(d,g); }).join("");
    $("view-standings").hidden = view!=="standings";
    $("view-matches").hidden = view!=="matches";
    if(window.GNDA && GNDA.setSub) GNDA.setSub(view==="matches" ? "s-matches" : "s-standings");
  }
  sel.addEventListener("change", render);
  window.addEventListener("hashchange", function(){ view = location.hash==="#matches" ? "matches" : "standings"; render(); });
  var q = /[?&]div=(\d)/.exec(location.search); if(q) sel.value = q[1];
  render();
})();
</script>
</body>
</html>
