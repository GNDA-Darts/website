<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Singles · GNDA</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<meta name="description" content="GNDA singles league standings and matches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px}
.soon p{color:var(--ink2);max-width:60ch;margin:0}
</style>
</head>
<body>
<script src="../../assets/site.js" data-root="../../" data-page="league" data-sub="s-standings"></script>
<h1 class="sr">Singles league</h1>

<main>
  <div class="wrap">
    <div class="soon" id="soon"></div>
  </div>
</main>
<script>
(function(){
  // Until the first singles session starts, both views say "coming soon".
  // The standings and match-grid layout from the mockup is in the site's history (commit db9d1ba) for when real results exist.
  var TEXT = {
    standings: "Singles standings will appear here once the first session begins.",
    matches: "Each group's matches and results will appear here once the first session begins."
  };
  function show(){
    var view = location.hash==="#matches" ? "matches" : "standings";
    document.getElementById("soon").innerHTML = '<h2>Coming soon</h2><p>'+TEXT[view]+'</p>';
    if(window.GNDA && GNDA.setSub) GNDA.setSub(view==="matches" ? "s-matches" : "s-standings");
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
