<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sub List · GNDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<meta name="description" content="GNDA sub list: players available to fill in for league teams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px}
/* Sub list: short intro, then the list (table) beside the roster and sub rules. */
.lead{font-size:16px;color:var(--ink2);margin:0 0 16px;max-width:60ch}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px 48px;align-items:start}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.rules{margin:0;padding-left:18px;color:var(--ink2);line-height:1.55}
.rules li+li{margin-top:8px}
@media (max-width:820px){ .cols{grid-template-columns:minmax(0,1fr)} }
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:600 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--rule)}
td{padding:10px 16px;border-bottom:1px solid var(--rule)}
tr:last-child td{border-bottom:0}
td.d,th.d{text-align:center;width:1%;white-space:nowrap}
.div{display:inline-block;font:700 15px/1 var(--display);padding:4px 8px;border-radius:4px;background:var(--sunk);color:var(--ink2)}
</style>
</head>
<body>
<script src="../../assets/site.js" data-root="../../" data-page="league" data-sub="subs"></script>
<h1 class="sr">Sub list</h1>

<main>
  <div class="wrap">
    <p class="lead" id="intro"></p>
    <div class="cols">
      <div class="card"><table><thead><tr><th>Player</th><th class="d">Lowest division</th></tr></thead><tbody id="subs"></tbody></table></div>
      <section aria-labelledby="rules-h">
        <h2 id="rules-h">Roster and sub rules</h2>
        <ul class="rules" id="rules"></ul>
      </section>
    </div>
  </div>
</main>
<script src="../../data/league.js"></script>
<script>
(function(){
  var L = window.GNDA_LEAGUE || {};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function $(id){return document.getElementById(id)}
  $("intro").textContent = L.subsIntro || "";
  $("rules").innerHTML = (L.subRules||[]).map(function(r){return "<li>"+esc(r)+"</li>"}).join("");
  var subs = (L.subs||[]).slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
  $("subs").innerHTML = subs.length ? subs.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td class="d"><span class="div">'+esc(s.division)+'</span></td></tr>'}).join("")
    : '<tr><td colspan="2" class="empty">No subs listed right now.</td></tr>';
})();
</script>
</body>
</html>
