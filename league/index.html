<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Leagues · GNDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<meta name="description" content="The GNDA team league and singles league: how they work, when they play and what they cost.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:28px 56px}
/* Overview: how it works. */
.how{list-style:none;margin:0;padding:0}
.how li:first-child{padding-top:0}
.how li{padding:14px 0;border-bottom:1px solid var(--rule)}
.how b{display:block;font:700 19px/1.15 var(--display);text-transform:uppercase;letter-spacing:.04em}
.how p{margin:4px 0 0;color:var(--ink2);max-width:72ch}
.part + .part{margin-top:44px}
/* League heading with its registration button on the right */
.part-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.part-h h2{margin:0;display:flex;align-items:center;gap:10px}
.badge{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--surface);background:var(--red);border-radius:4px;padding:4px 6px}
.btn.primary{background:var(--green);color:var(--surface);border:1px solid var(--green)}
/* Singles divisions table */
.divs{width:100%;max-width:760px;border-collapse:collapse;margin:10px 0 8px;font-size:15px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.divs th,.divs td{text-align:left;padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top}
.divs thead th{border-top:0;font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.divs td:first-child{font-weight:700;white-space:nowrap}
@media (max-width:520px){ .divs thead{display:none} .divs tr{display:block;border-top:1px solid var(--rule);padding:8px 12px} .divs tr:first-child{border-top:0} .divs td{display:block;border:0;padding:2px 0} }
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="league" data-sub="overview"></script>
<h1 class="sr">Leagues overview</h1>

<main>
  <div class="wrap">
    <section class="part" aria-labelledby="h-team"><div class="part-h"><h2 id="h-team">Team league</h2><span id="reg-team"></span></div><ul class="how" id="how"></ul></section>
    <section class="part" aria-labelledby="h-singles"><div class="part-h"><h2 id="h-singles">Singles league <span class="badge">New</span></h2><span id="reg-singles"></span></div><ul class="how" id="singles"></ul></section>
  </div>
</main>
<script src="../data/league.js"></script>
<script>
(function(){
  var L = window.GNDA_LEAGUE || {};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function $(id){return document.getElementById(id)}
  // [text](link) in a paragraph becomes a link; site pages are relative to the top folder
  function linkify(t){
    return esc(t).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, txt, url){
      var u = /^https?:\/\//i.test(url) ? url : "../" + url.replace(/^\/+/, "");
      return '<a href="'+u+'">'+txt+'</a>';
    });
  }
  function item(h){
    var t = h.divisions ? '<table class="divs"><thead><tr><th>Division</th><th>Match</th><th>Standings by</th></tr></thead><tbody>'+
      (L.singlesDivisions||[]).map(function(d){return '<tr><td>'+esc(d.division)+'</td><td>'+esc(d.match)+'</td><td>'+esc(d.ranked)+'</td></tr>'}).join("")+'</tbody></table>' : '';
    return '<li><b>'+esc(h.title)+'</b>'+t+'<p>'+linkify(h.text)+'</p></li>';
  }
  function reg(id, b){ if(b) $(id).innerHTML = '<a class="btn primary" href="../'+esc(b[1])+'">'+esc(b[0])+'</a>'; }
  reg("reg-team", L.teamRegister);
  reg("reg-singles", L.singlesRegister);
  $("how").innerHTML = (L.howItWorks||[]).map(item).join("");
  $("singles").innerHTML = (L.singlesHow||[]).map(item).join("");
})();
</script>
</body>
</html>
