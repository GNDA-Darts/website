<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>League · GNDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<meta name="description" content="How the GNDA league works: Wednesday nights, teams and divisions, and sessions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/pages.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main .wrap{padding-block:32px 56px}
/* Overview: how it works. */
.how{list-style:none;margin:0;padding:0}
.how li:first-child{padding-top:0}
.how li{padding:14px 0;border-bottom:1px solid var(--rule)}
.how b{display:block;font:700 19px/1.15 var(--display);text-transform:uppercase;letter-spacing:.04em}
.how p{margin:4px 0 0;color:var(--ink2);max-width:72ch}
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="league" data-sub="overview"></script>
<h1 class="sr">League overview</h1>

<main>
  <div class="wrap">
    <ul class="how" id="how"></ul>
  </div>
</main>
<script src="../data/league.js"></script>
<script>
(function(){
  var L = window.GNDA_LEAGUE || {};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function $(id){return document.getElementById(id)}
  // [text](link) in a paragraph becomes a link; site pages are relative to the top folder
  function linkify(t){
    return esc(t).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, txt, url){
      var u = /^https?:\/\//i.test(url) ? url : "../" + url.replace(/^\/+/, "");
      return '<a href="'+u+'">'+txt+'</a>';
    });
  }
  $("how").innerHTML = (L.howItWorks||[]).map(function(h){return '<li><b>'+esc(h.title)+'</b><p>'+linkify(h.text)+'</p></li>'}).join("");
})();
</script>
</body>
</html>
